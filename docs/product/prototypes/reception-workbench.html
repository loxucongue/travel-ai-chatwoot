<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,"><title>China2Go · 接待配置设计预览</title>
<style>
:root{font-family:Inter,"Microsoft YaHei",sans-serif;color:#253e3c;background:#f4f6f5;font-size:14px;--green:#127569;--muted:#70847f;--line:#dfe6e2}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer;background:white;border:1px solid var(--line);border-radius:8px;padding:9px 13px;color:inherit}button:hover{border-color:var(--green);background:#f1f8f5}button:disabled{opacity:.45;cursor:default}button.primary{background:var(--green);color:white;border-color:var(--green)}input,textarea,select{width:100%;border:1px solid #ccd9d2;border-radius:7px;padding:10px;background:white;color:inherit}textarea{resize:vertical;min-height:90px;line-height:1.7}label{display:block;font-weight:600;margin:16px 0 7px}input[type=checkbox]{width:auto;margin-right:9px}h1{font-size:26px;font-weight:650;margin:8px 0}h2{font-size:18px;margin:0 0 10px}h3{font-size:15px;margin:0 0 12px}p{line-height:1.7;margin:8px 0}small,.muted{color:var(--muted);line-height:1.7}aside{position:fixed;width:218px;background:#fff;height:100vh;padding:26px 18px;border-right:1px solid var(--line);display:flex;flex-direction:column}.brand{font-size:21px;font-weight:750;letter-spacing:-.5px;margin-bottom:24px}.brand b{display:inline-block;background:var(--green);color:white;border-radius:11px;padding:6px 9px;margin-right:6px}.nav-label{font-size:11px;color:var(--muted);letter-spacing:2px;margin:24px 12px 9px}aside button{border:0;background:transparent;text-align:left;margin:2px 0;padding:12px 13px}aside button.active{background:#e5f2ed;color:var(--green);font-weight:700}aside footer{margin-top:auto;font-size:12px;line-height:1.8;color:var(--muted);padding:10px}main{margin-left:218px;padding:26px 34px 110px;max-width:1680px}.top{display:flex;justify-content:space-between;align-items:start;gap:20px}.badge{display:inline-block;font-size:12px;background:#e5f2ed;color:var(--green);padding:5px 9px;border-radius:5px}.amber{background:#fff0d5;color:#865b21}.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:26px 0 24px;overflow:auto}.tabs button{border:0;border-radius:0;background:transparent;padding:0 3px 13px;white-space:nowrap;color:var(--muted)}.tabs button.active{border-bottom:3px solid var(--green);color:var(--green);font-weight:700}.grid{display:grid;grid-template-columns:230px minmax(260px,1fr) 300px;gap:20px}.two{display:grid;grid-template-columns:minmax(320px,1fr) minmax(270px,.8fr);gap:24px}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:16px}.compact{padding:16px}.list button{display:block;width:100%;text-align:left;margin-bottom:8px;padding:14px}.list button.selected{background:#eaf4ef;border-color:#8cb8a7}.list button small{display:block;margin-top:5px}.number{display:inline-flex;width:25px;height:25px;align-items:center;justify-content:center;background:#e7f0eb;color:var(--green);border-radius:7px;margin-right:8px}.row{display:flex;align-items:center;gap:10px}.row.between{justify-content:space-between}.row input[type=number]{max-width:85px}.bubble{background:#f1f5f2;border-radius:4px 12px 12px 12px;padding:14px;line-height:1.85;margin-top:12px;white-space:pre-wrap}.customer{background:#dceee7;margin-left:45px}.preview{background:#fafcfb}.placeholder{height:108px;border-radius:8px;background:linear-gradient(145deg,#dce9e2,#b9d1c6);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#476d5f;text-align:center;margin:10px 0}.placeholder small{font-size:10px;color:#476d5f}.notice{border-left:3px solid #b4cfc1;background:#eef4ef;padding:12px 15px;line-height:1.8;color:#527263;font-size:12px;margin:14px 0}.bar{position:fixed;bottom:0;left:218px;right:0;background:#fffffff5;border-top:1px solid var(--line);padding:16px 34px;display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:2}.bar small{display:block}.asset-chip{padding:9px 12px;border:1px solid var(--line);border-radius:7px;margin:7px 0;display:flex;justify-content:space-between;align-items:center}.asset-chip button{padding:2px 7px}.stack{display:grid;gap:12px}.pill{font-size:11px;background:#f0f3f1;border-radius:20px;padding:3px 7px;color:#627b71}.toolbar{display:flex;gap:8px;margin-bottom:16px}.toolbar select{max-width:220px}table{width:100%;border-collapse:collapse;background:white}th,td{text-align:left;padding:14px;border-bottom:1px solid var(--line);line-height:1.6}th{font-weight:500;font-size:12px;color:var(--muted)}dialog{border:1px solid var(--line);border-radius:14px;width:min(620px,92vw);max-height:85vh;padding:25px;box-shadow:0 24px 80px #143d3b30}dialog::backdrop{background:#193c3b50}.assets{display:grid;grid-template-columns:1fr 1fr;gap:12px}.assets label{font-weight:400;border:1px solid var(--line);border-radius:9px;padding:13px;margin:0}.toast{position:fixed;top:18px;right:26px;color:white;background:#254f44;padding:12px 18px;border-radius:9px;z-index:5;max-width:450px}a{color:var(--green)}.timeline{border-left:2px solid #d8e5dc;padding-left:18px}.timeline p{font-size:13px}.empty{text-align:center;padding:40px;color:var(--muted)}:focus-visible{outline:3px solid #87bdb0;outline-offset:2px}@media(max-width:1200px){.grid{grid-template-columns:190px minmax(240px,1fr)}.grid>.preview{grid-column:1/-1}.two{grid-template-columns:1fr}}@media(max-width:760px){aside{position:static;width:auto;height:auto;padding:14px;display:block}aside .brand,aside .nav-label,aside footer{display:none}aside button{display:inline-block;font-size:12px;padding:9px}main{margin:0;padding:22px 16px 120px}.grid,.two{display:block}.top{display:block}.top>.row{margin-top:16px}.bar{left:0;padding:12px 16px}.bar small{max-width:200px}.assets{grid-template-columns:1fr}.tabs{gap:16px}.toolbar{flex-wrap:wrap}table{font-size:12px}}
</style>
<aside><div class="brand"><b>✳</b> China2Go</div><div class="nav-label">工作</div><button data-nav="demo">▷ 接待演练</button><div class="nav-label">配置</div><button data-nav="general">通用接待</button><button data-nav="route">线路接待</button><button data-nav="knowledge">通用知识与素材</button><button data-nav="connections">连接设置</button><footer>交互设计预览 · 非业务系统<br>仅保存到当前浏览器<br>占位素材，不发送客户消息</footer></aside>
<main><div class="top"><div><small>CHINA2GO / 接待工作台</small><h1 id="title"></h1><p class="muted" id="subtitle"></p></div><div class="row"><span class="badge amber">设计预览</span><button id="history">修改记录</button><button id="demo">预览接待流程 →</button></div></div><nav class="tabs" id="tabs"></nav><div id="view"></div></main>
<div class="bar"><div><strong id="status">浏览器示例草稿</strong><small id="effect"></small></div><div class="row"><button id="reset">重置示例</button><button class="primary" id="save">保存预览草稿</button></div></div>
<dialog id="modal"></dialog><div id="toast" hidden class="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const assets=[{id:'map9',name:'桃花 9 日 · 行程图',scope:'9',type:'图片'},{id:'map11',name:'桃花珠峰 11 日 · 行程图',scope:'11',type:'图片'},{id:'hotel',name:'住宿环境',scope:'both',type:'图片'},{id:'car',name:'车辆与座位',scope:'both',type:'图片'},{id:'pdf',name:'高原旅行说明',scope:'common',type:'PDF'},{id:'brand',name:'品牌介绍',scope:'common',type:'视频'}];
const makeRoute=n=>({name:n==='9'?'林芝桃花 9 日':'桃花珠峰 11 日',entry:'我想了解'+n+'日桃花行程',inner:2,gap:3,groups:[{name:'行程总览',text:'這是這趟行程的路線圖，先讓您看看整體安排。',assets:['map'+n]},{name:'沿途亮点',text:'沿途亮点介绍的示例位置。实际开发保留现有已配置原文。',assets:[]},{name:'住宿安排',text:'这里显示本线路已配置的住宿介绍原文。',assets:['hotel']},{name:'车辆安排',text:'这里显示本线路已配置的车辆介绍原文。',assets:['car']}],scripts:[{name:'住宿顾虑',scene:'客户关注住宿环境、房型或位置',text:'这里使用业务已配置的住宿话术。按当前问题选择有关部分，保留本线路的适用条件。',assets:['hotel'],enabled:true},{name:'客户询问车辆',scene:'客户想看车内空间和座位',text:'這是車內座位的照片，您可以先看看空間和座椅配置。',assets:['car'],enabled:true}],facts:'价格、住宿例外、行程安排等事实从当前线路包迁入，不在原型中重新编写。'});
const defaults=()=>({opening:'您好～這裡是 China2Go 國旅環球，歡迎您來詢問西藏行程。',openingGap:2,voice:'自然的台湾顾问表达；常见场景优先用已有话术，按客户情况调整衔接。',common:[{name:'客户表示考虑',scene:'客户想和家人商量或稍后决定',text:'沒問題，您先和家人討論，有想進一步了解的地方再問我就好。',assets:[],enabled:true}],channels:['LINE','微信','电话','Email','WhatsApp'],lead:'如果您想接著確認出發安排，方便留一個您常用的聯絡方式嗎？',silenceFirst:1,silenceNext:120,silenceOn:true,routes:{'9':makeRoute('9'),'11':makeRoute('11')},knowledge:'在这里维护跨线路适用的服务事实及其条件。具体产品的价格和住宿安排回到线路页维护。',history:[]});
let data;try{data=JSON.parse(localStorage.getItem('china2go-design-v1'))||defaults()}catch{data=defaults()}
data.channels ??= ['LINE','微信','电话','Email','WhatsApp'];
let page='route',tab=1,route='9',group=0,script=0,dirty=false;
const meta={general:['通用接待','所有线路共用的开场、话术与跟进方式',['首次开场','通用话术','留资与交接','沉默跟进']],route:['线路接待','围绕一条线路，维护入口、完整介绍和常见问题',['入口与概况','完整介绍','场景话术','事实与素材']],knowledge:['通用知识与素材','跨线路的服务事实和可重复引用的文件',['服务事实','通用素材','官网来源']],connections:['连接设置','接收消息、调用模型和通知顾问的连接',['渠道','模型','顾问通知','维护工具']],demo:['接待演练','设计流程模拟 · 按按钮推进，无模型调用与真实发送',['介绍与答疑']]};
const r=()=>data.routes[route],assetName=id=>assets.find(a=>a.id===id)?.name||id;
const field=(label,value,key,area=true)=>`<label for="edit-${key}">${label}</label><${area?'textarea':'input'} id="edit-${key}" data-edit="${key}" ${area?'rows="3"':`value="${esc(value)}"`}>${area?esc(value):''}${area?'</textarea>':''}`;
const chips=(ids,remove=false)=>ids.map((id,i)=>`<div class="asset-chip"><span>${esc(assetName(id))} <span class="pill">引用</span></span>${remove?`<button data-remove="${i}" aria-label="移除${esc(assetName(id))}">×</button>`:''}</div>`).join('');
const notice=t=>`<div class="notice">${t}</div>`;
function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,3300)}
function mark(){dirty=true;$('#status').textContent='有未保存的预览修改'}
function nav(p,t=0){page=p;tab=t;script=0;render()}
function render(){const m=meta[page];$('#title').textContent=m[0];$('#subtitle').textContent=m[1];document.querySelectorAll('[data-nav]').forEach(e=>e.classList.toggle('active',e.dataset.nav===page));$('#tabs').innerHTML=m[2].map((t,i)=>`<button data-tab="${i}" class="${i===tab?'active':''}">${t}</button>`).join('');$('#effect').textContent=page==='route'&&tab===1?'设计生效点：下一次开始介绍；进行中的介绍保持原版。':page==='general'&&tab===0?'设计生效点：下一位新客户；首条消息里的问题继续处理。':'原型仅演示配置编辑，不修改真实接待配置。';$('#save').disabled=page==='demo';$('#view').innerHTML=page==='route'?routeView():page==='general'?generalView():page==='knowledge'?knowledgeView():page==='connections'?connectionsView():demoView();bind();}
function routeSelect(){return `<div class="toolbar"><select id="routeSelect" aria-label="选择线路"><option value="9" ${route==='9'?'selected':''}>林芝桃花 9 日</option><option value="11" ${route==='11'?'selected':''}>桃花珠峰 11 日</option></select><span class="badge">线路专属配置</span></div>`}
function routeView(){let html=routeSelect();if(tab===0)return html+`<div class="two"><section class="card"><h2>入口与概况</h2>${field('线路名称',r().name,'routeName',false)}${field('广告自动消息',r().entry,'entry')}<small>这是您在广告中设置的入口消息；不需要配置判断关键词。</small>${notice('广告消息明确线路 → 发送首次开场 → 开始该线路介绍。<br>未明确线路 → 根据需求匹配 → 确认后介绍。')}</section><section class="card preview"><h2>首次接待预览</h2><div class="bubble customer">${esc(r().entry)}</div><div class="bubble">${esc(data.opening)}</div><p class="muted">接着进入 ${esc(r().name)} 的完整介绍。首条消息中的问题保留到答疑。</p></section></div>`;
if(tab===2)return html+scriptView(false);if(tab===3)return html+`<div class="two"><section class="card"><h2>线路事实</h2>${field('产品事实与适用条件',r().facts,'facts')}<p class="muted">价格、档期、住宿、供氧和来源在这里统一维护。</p></section><section class="card"><h2>图片与文件</h2>${chips(assets.filter(a=>a.scope===route||a.scope==='both').map(a=>a.id))}${notice('话术和完整介绍引用这些文件。替换素材影响下次接待，历史发送记录保留原版本。')}<button id="allAssets">查看素材选择器</button></section></div>`;
const g=r().groups[group];return html+`<div class="grid"><section class="card compact"><h3>整套介绍 · ${r().groups.length} 组</h3><div class="list">${r().groups.map((x,i)=>`<button data-group="${i}" class="${i===group?'selected':''}"><span class="number">${i+1}</span>${esc(x.name)}<small>${1+x.assets.length} 条消息</small></button>`).join('')}</div><button id="addGroup">＋ 添加一组</button>${notice('完整介绍结束后，集中回答期间的问题。')}<label>组内间隔（秒）</label><input data-edit="inner" type="number" min="0" value="${r().inner}"><label>默认组间隔（秒）</label><input data-edit="gap" type="number" min="0" value="${r().gap}"></section><section class="card"><div class="row between"><h2>编辑第 ${group+1} 组</h2><span class="badge">固定原文发送</span></div>${field('组名称',g.name,'groupName',false)}${field('文字消息',g.text,'groupText')}<label>后续素材</label>${chips(g.assets,true)}<button id="pickAssets">＋ 引用图片 / 文件</button><p class="muted">此原型展示“文字 → 素材”；正式编辑器支持逐块排序。</p><hr style="border:0;border-top:1px solid var(--line);margin:25px 0"><div class="row"><button id="up" ${group===0?'disabled':''}>↑ 上移</button><button id="down" ${group===r().groups.length-1?'disabled':''}>↓ 下移</button><button id="deleteGroup" ${r().groups.length===1?'disabled':''}>删除本组</button></div></section><section class="card preview"><div class="row between"><h2>客户视角</h2><span class="pill">第 ${group+1} 组</span></div><div id="livePreview"><div class="bubble">${esc(g.text)}</div>${g.assets.map(id=>`<div class="placeholder">${esc(assetName(id))}<small>素材占位 · 非实际文件</small></div>`).join('')}</div><small>本组 ${1+g.assets.length} 条消息 · 组内间隔 ${r().inner} 秒</small>${notice(`<span id="duration">${duration()}</span>`)}<button id="fullPreview">查看整套发送顺序</button></section></div>`}
function duration(){return `共 ${r().groups.reduce((n,g)=>n+1+g.assets.length,0)} 条消息 · 最低等待 ${r().groups.reduce((n,g)=>n+g.assets.length*Number(r().inner),0)+(r().groups.length-1)*Number(r().gap)} 秒<br>另加实际发送耗时；期间普通问题等待整套结束。`}
function scriptView(common){const list=common?data.common:r().scripts;script=Math.min(script,list.length-1);const s=list[script];return `<div class="two"><section class="card"><div class="row between"><h2>${common?'通用话术':'本线路话术'}</h2><button id="addScript">＋ 新增</button></div><div class="list">${list.map((s,i)=>`<button data-script="${i}" class="${i===script?'selected':''}">${esc(s.name)} <span class="pill">${s.enabled?'启用':'停用'}</span><small>${esc(s.scene)}</small></button>`).join('')}</div>${!common?`${notice('同时可使用通用话术。只有同场景的线路专属版本会覆盖通用版本。')}<button id="commonLink">查看通用话术 →</button>`:''}</section><section class="card"><h2>编辑场景话术</h2><span class="badge">原文优先 · 可按语境调整</span>${field('话术名称',s.name,'scriptName',false)}${field('适用场景',s.scene,'scriptScene')}${field('话术原文',s.text,'scriptText')}<label><input id="scriptOn" type="checkbox" ${s.enabled?'checked':''}>启用此话术</label><label>引用素材</label>${chips(s.assets,true)}<button id="pickAssets">＋ 从素材库选择</button>${notice('无需写关键词规则，也无需重复上传图片。示例话术不是新的产品事实。')}</section></div>`}
function generalView(){if(tab===1)return scriptView(true);if(tab===0)return `<div class="two"><section class="card"><h2>首次开场</h2><span class="badge">按原文发送</span>${field('开场文字',data.opening,'opening')}<label>消息间隔（秒）</label><input type="number" min="0" data-edit="openingGap" value="${data.openingGap}">${field('品牌语气',data.voice,'voice')}${notice('开场只看是否首次进入，与客户用什么词无关。演练的一个会话视为一个客户。')}</section><section class="card preview"><h2>客户视角</h2><div class="bubble" id="openingPreview">${esc(data.opening)}</div><p class="muted">固定开场不经过 AI 改写。第一条消息中的线路和问题继续处理。</p><p class="muted">正式编辑器复用介绍中的消息块，支持图片、视频和文件。</p></section></div>`;if(tab===2)return `<div class="two"><section class="card"><h2>主动留资</h2><div class="row" style="flex-wrap:wrap">${['LINE','微信','电话','Email','WhatsApp'].map(c=>`<label><input data-channel="${c}" type="checkbox" ${data.channels.includes(c)?'checked':''}>${c}</label>`).join('')}</div>${field('索取联系方式的表达',data.lead,'lead')}${notice('AI 根据当前问题和客户兴趣决定时机，不按固定轮数索取。')}</section><section class="card"><h2>交给顾问</h2><p>取得有效联系方式，或客户要求真人后结束自动介绍，将期间的问题一起交给顾问。</p><p class="muted">顾问账号和手机提醒在连接设置维护。</p><button data-jump="connections:2">设置顾问通知 →</button></section></div>`;return `<div class="two"><section class="card"><h2>沉默跟进节奏</h2><label><input id="silenceOn" type="checkbox" ${data.silenceOn?'checked':''}>启用沉默评估</label><label>首次等待（分钟）</label><input data-edit="silenceFirst" type="number" min="1" value="${data.silenceFirst}"><label>后续等待（分钟）</label><input data-edit="silenceNext" type="number" min="1" value="${data.silenceNext}">${notice('从完整介绍和待答问题全部处理完后计时。到期评估，有相关新价值才发送。')}</section><section class="card"><h2>使用哪些话术</h2><p>通用和线路话术中适合继续沟通的内容。已经讲过、客户不想再联系、已经留资或交给顾问时不继续触达。</p><button data-jump="general:1">维护通用话术 →</button></section></div>`}
function knowledgeView(){if(tab===0)return `<section class="card"><h2>跨线路服务事实</h2>${field('事实正文与适用条件',data.knowledge,'knowledge')}${notice('事实说明“可以说什么”；通用话术说明“怎么说”。具体线路的事实在所属线路中维护。')}</section>`;if(tab===1)return `<section class="card"><h2>通用素材</h2>${chips(['pdf','brand'])}<button id="allAssets">打开素材选择器</button><p class="muted">可供通用和线路话术引用，无需复制文件。</p></section>`;return `<section class="card"><h2>官网来源</h2><table><tr><th>来源</th><th>内容去向</th><th>处理方式</th></tr><tr><td>china2go.com · 线路页面</td><td>对应线路事实</td><td>查看变更后保存</td></tr><tr><td>服务与旅行说明页面</td><td>通用服务事实</td><td>保留来源与条件</td></tr></table>${notice('原型不连接网站。正式页面展示真实抓取时间与内容差异，不自动把所有网页放进全局知识。')}</section>`}
function connectionsView(){const texts=[['渠道连接','Chatwoot 地址、账号与凭据','收件箱与自动接待开关','Webhook 连接状态','全局发送状态与接待范围'],['实际调用模型','显示 V2 实际使用的模型名称','显示配置来源：环境变量或后台设置','环境变量配置只读；可编辑字段必须连接真实调用者','旧 V1 Adapter 移至维护工具'],['顾问通知','接收顾问与 Chatwoot 账号','机器人身份与提及通知','通知测试显示“接口已接受”','手机是否收到需要设备确认'],['维护工具','历史消息导入','标签映射','现有成员管理','配置变更记录']][tab];return `<section class="card"><h2>${texts[0]}</h2><p class="muted">此页展示配置归属，不读取真实连接信息或凭据。</p><div class="stack">${texts.slice(1).map(t=>`<div class="asset-chip">${t}<span class="pill">保留现有能力</span></div>`).join('')}</div></section>`}
let sim={index:0,queue:[],answered:[],state:'sending',log:[]};
function demoView(){return `${routeSelect()}<div class="two"><section class="card"><div class="row between"><h2>介绍进度</h2><span class="badge">${({sending:'介绍中',completed:'介绍完成，待答疑',answered:'待答已处理',stopped:'已停止',handoff:'已交给顾问'})[sim.state]}</span></div><p>已发 ${sim.index} / ${r().groups.length} 组</p><div class="timeline">${r().groups.map((g,i)=>`<p>${i<sim.index?'✓':'○'} ${esc(g.name)}</p>`).join('')}</div><div class="toolbar"><button class="primary" id="next" ${sim.state!=='sending'?'disabled':''}>模拟发送下一组</button><button id="answer" ${sim.state!=='completed'?'disabled':''}>集中处理待答问题</button></div><label for="question">介绍期间客户发来消息</label><input id="question" placeholder="例如：住宿有独立卫浴吗？"><div class="toolbar" style="margin-top:12px"><button id="enqueue">加入普通问题</button><button id="stop">模拟停止</button><button id="handoff">模拟转人工</button><button id="switchRoute">模拟改线</button></div>${notice('这里用按钮明确选择事件，仅演示顺序。实际接待由主 Agent 理解消息，不采用关键词脚本。')}<button id="simReset">重新演练</button></section><section class="card"><h2>待回答 ${sim.queue.length} 条</h2>${sim.queue.length?sim.queue.map(q=>`<div class="bubble customer">${esc(q)}</div>`).join(''):'<p class="muted">介绍期间的普通问题会保留在这里。</p>'}<h3 style="margin-top:24px">处理记录</h3>${sim.log.length?sim.log.map(q=>`<p>${esc(q)}</p>`).join(''):'<p class="muted">先发一组介绍，再加入客户问题。</p>'}${sim.answered.map(q=>`<div class="bubble">已交给答疑任务（模拟）：${esc(q)}</div>`).join('')}</section></div>`}
function picker(readonly=false){let ids=page==='route'&&tab===1?r().groups[group].assets:page==='general'?data.common[script].assets:r().scripts[script].assets;const commonOnly=page==='general'||page==='knowledge';const list=assets.filter(a=>a.scope==='common'||!commonOnly&&(a.scope===route||a.scope==='both'));$('#modal').innerHTML=`<div class="row between"><h2>${readonly?'素材目录':'引用素材'}</h2><button id="closeModal">关闭</button></div><p class="muted">${commonOnly?'通用素材':'本线路与通用素材'} · 文件只上传一次</p><div class="assets">${list.map(a=>`<label><div class="placeholder">${a.type}<small>占位预览</small></div><input type="checkbox" value="${a.id}" ${ids.includes(a.id)?'checked':''} ${readonly?'disabled':''}>${a.name}<small style="display:block">${a.scope==='common'?'通用':'线路'}素材</small></label>`).join('')}</div>${readonly?'':'<button class="primary" id="applyAssets" style="margin-top:22px">应用引用</button>'}`;$('#modal').showModal();$('#closeModal').onclick=()=>$('#modal').close();if(!readonly)$('#applyAssets').onclick=()=>{const chosen=[...$('#modal').querySelectorAll('input:checked')].map(e=>e.value);ids.splice(0,ids.length,...chosen);mark();$('#modal').close();render()}}
function bind(){document.querySelectorAll('[data-channel]').forEach(e=>e.onchange=()=>{data.channels=[...document.querySelectorAll('[data-channel]:checked')].map(x=>x.dataset.channel);mark()});document.querySelectorAll('[data-tab]').forEach(e=>e.onclick=()=>{tab=Number(e.dataset.tab);script=0;render()});document.querySelectorAll('[data-jump]').forEach(e=>e.onclick=()=>{const [p,t]=e.dataset.jump.split(':');nav(p,Number(t))});if($('#routeSelect'))$('#routeSelect').onchange=e=>{route=e.target.value;group=0;script=0;sim={index:0,queue:[],answered:[],state:'sending',log:[]};render()};document.querySelectorAll('[data-group]').forEach(e=>e.onclick=()=>{group=Number(e.dataset.group);render()});document.querySelectorAll('[data-script]').forEach(e=>e.onclick=()=>{script=Number(e.dataset.script);render()});document.querySelectorAll('[data-edit]').forEach(e=>e.oninput=()=>{const k=e.dataset.edit,v=e.type==='number'?Math.max(0,Number(e.value)):e.value;const s=page==='general'?data.common[script]:r().scripts[script];if(k==='groupName')r().groups[group].name=v;else if(k==='groupText')r().groups[group].text=v;else if(k==='routeName')r().name=v;else if(['entry','facts','inner','gap'].includes(k))r()[k]=v;else if(k==='scriptName')s.name=v;else if(k==='scriptScene')s.scene=v;else if(k==='scriptText')s.text=v;else data[k]=v;mark();if(k==='opening'&&$('#openingPreview'))$('#openingPreview').textContent=v;if(k==='groupText'&&$('#livePreview .bubble'))$('#livePreview .bubble').textContent=v;if(['inner','gap'].includes(k)&&$('#duration'))$('#duration').innerHTML=duration()});const on=(id,f)=>{if($(id))$(id).onclick=f};on('#pickAssets',()=>picker());on('#allAssets',()=>picker(true));on('#commonLink',()=>nav('general',1));on('#addGroup',()=>{r().groups.push({name:'新增介绍组',text:'请填写本组介绍原文。',assets:[]});group=r().groups.length-1;mark();render()});on('#deleteGroup',()=>{r().groups.splice(group,1);group=Math.max(0,group-1);mark();render()});for(const [id,d]of [['#up',-1],['#down',1]])on(id,()=>{const a=r().groups;[a[group],a[group+d]]=[a[group+d],a[group]];group+=d;mark();render()});on('#addScript',()=>{const a=page==='general'?data.common:r().scripts;a.push({name:'新场景',scene:'填写什么时候使用',text:'填写话术原文',assets:[],enabled:true});script=a.length-1;mark();render()});on('#scriptOn',()=>{(page==='general'?data.common:r().scripts)[script].enabled=$('#scriptOn').checked;mark()});on('#silenceOn',()=>{data.silenceOn=$('#silenceOn').checked;mark()});document.querySelectorAll('[data-remove]').forEach(e=>e.onclick=()=>{const ids=page==='route'&&tab===1?r().groups[group].assets:page==='general'?data.common[script].assets:r().scripts[script].assets;ids.splice(Number(e.dataset.remove),1);mark();render()});on('#fullPreview',()=>{showDialog('整套发送顺序',r().groups.map((g,i)=>`<h3>${i+1}. ${esc(g.name)}</h3><div class="bubble">${esc(g.text)}</div>${chips(g.assets)}<p class="muted">${i<r().groups.length-1?'等待 '+r().gap+' 秒后进入下一组':'完成后集中答疑'}</p>`).join(''))});on('#next',()=>{sim.log.push('已模拟提交：'+r().groups[sim.index].name);sim.index++;if(sim.index===r().groups.length)sim.state='completed';render()});on('#enqueue',()=>{const q=$('#question').value.trim();if(!q)return;if(['handoff','stopped'].includes(sim.state)){toast('原介绍已结束，这条新消息需进入新的接待或人工处理。');return}sim.queue.push(q);if(sim.state==='answered')sim.state='completed';sim.log.push('普通问题已登记；未中断介绍');render()});on('#answer',()=>{sim.answered.push(...sim.queue);sim.queue=[];sim.state='answered';sim.log.push('问题批次交给主 Agent；后续才判断留资或沉默（原型不生成答案）');render()});on('#stop',()=>{sim.state='stopped';sim.log.push('停止未提交介绍；保留待答，明确问题仍可被动回答');render()});on('#handoff',()=>{sim.state='handoff';sim.log.push('交接摘要包含待答 '+sim.queue.length+' 条及已发 '+sim.index+' 组；不继续自动销售');render()});on('#switchRoute',()=>{route=route==='9'?'11':'9';sim.index=0;sim.state='sending';sim.log.push('原介绍结束，改为 '+r().name+'；旧问题保留原线路语境');render()});on('#simReset',()=>{sim={index:0,queue:[],answered:[],state:'sending',log:[]};render()})}
function showDialog(title,body){$('#modal').innerHTML=`<div class="row between"><h2>${title}</h2><button id="closeModal">关闭</button></div>${body}`;$('#modal').showModal();$('#closeModal').onclick=()=>$('#modal').close()}
document.querySelectorAll('[data-nav]').forEach(e=>e.onclick=()=>nav(e.dataset.nav));$('#demo').onclick=()=>nav('demo');$('#history').onclick=()=>showDialog('当前浏览器的预览保存记录',data.history.length?data.history.map(h=>`<p>${esc(h)}</p>`).join(''):'<p class="muted">尚无记录。这不是业务发布记录。</p>');$('#save').onclick=()=>{data.history.unshift(new Date().toLocaleString()+' · '+meta[page][0]);data.history=data.history.slice(0,15);try{localStorage.setItem('china2go-design-v1',JSON.stringify(data));dirty=false;$('#status').textContent='预览草稿已保存到本浏览器';toast('仅保存预览草稿，未修改真实系统。')}catch{toast('浏览器无法保存，请保留当前页面。')}};$('#reset').onclick=()=>{showDialog('重置示例', '<p>仅重置这个浏览器的原型编辑内容，不影响真实系统。</p><button class="primary" id="confirmReset">确认重置预览</button>');$('#confirmReset').onclick=()=>{data=defaults();localStorage.removeItem('china2go-design-v1');group=script=0;dirty=false;$('#modal').close();$('#status').textContent='浏览器示例草稿';render()}};window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});render();
</script>
</html>
