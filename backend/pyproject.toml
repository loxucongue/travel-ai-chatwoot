[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-ai-chatwoot-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6,<7",
  "opencc-python-reimplemented==0.1.7",
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.16,<2",
  "pydantic-settings>=2.10,<3",
  "httpx>=0.28,<1",
  "argon2-cffi>=25,<26",
  "cryptography>=45,<47",
  "python-multipart>=0.0.20,<1",
  "email-validator>=2.2,<3",
  "tzdata>=2025.1",
  "playwright>=1.55,<2",
  "Pillow>=12.3,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "respx>=0.22,<1"]
scrape = ["beautifulsoup4>=4.15,<5", "markdownify>=1.2,<2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
